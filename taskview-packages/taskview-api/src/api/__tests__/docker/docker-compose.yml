services:
  db:
    image: postgres:17
    restart: "no"
    command: postgres -c max_connections=300
    env_file:
      - .env.postgresql
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvdbuser -d taskviewdb"]
      interval: 3s
      timeout: 3s
      retries: 10

  migration:
    image: gimanhead/taskview-ce-db-migration:test
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.taskview

  api:
    image: gimanhead/taskview-ce-api-server:test
    restart: "no"
    ports:
      - "11401:1401"
    depends_on:
      migration:
        condition: service_completed_successfully
    env_file:
      - .env.taskview
    environment:
      # The test suite runs against a closed instance (see registration-flag.test.ts);
      # no other test creates accounts through public registration paths.
      ALLOW_PUBLIC_REGISTRATION: "false"
      # Self-service deletion is off by default; account-deletion.test.ts covers the
      # enabled flow, the API unit tests cover the default
      ALLOW_ACCOUNT_DELETION: "true"
      # IdP-facing URLs are built from this base (see sso-public-urls.test.ts)
      API_PUBLIC_URL: "https://api.public.example"
      # Domains that skip DNS/HTTP ownership proof — used by sso.test.ts to
      # deterministically produce a *verified* config (method 'trusted'),
      # and by scim.test.ts / scim-pocket-id.test.ts / scim-group-projects.test.ts, since SCIM requires a verified domain.
      SSO_TRUSTED_DOMAINS: "owned-sso.example,scim-e2e.example,scim-e2e-other.example,scim-pocketid.example,scim-groups.example"
      # The webhook receiver of webhooks.test.ts runs on the host and is reached
      # via host.docker.internal, a private address from inside the container.
      WEBHOOKS_ALLOW_PRIVATE_URLS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null http://localhost:1401/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10

  # A real SCIM client for scim-pocket-id.test.ts: it pushes its users to the api over the compose network
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.18.0
    restart: "no"
    ports:
      - "11411:1411"
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_URL: "http://localhost:11411"
      ENCRYPTION_KEY: "taskview-test-encryption-key-0123456789"
      # Admin access for the tests without a sign-in: requests send it in the X-API-Key header
      STATIC_API_KEY: "taskview-test-pocket-id-api-key"
      # Turns off the hourly and the "5 minutes after a change" syncs: the tests trigger every sync themselves
      APP_ENV: "test"
      ANALYTICS_DISABLED: "true"
      VERSION_CHECK_DISABLED: "true"
      DISABLE_RATE_LIMITING: "true"
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20
